<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob:; style-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:"><title>Manga Desktop</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><small>TU BIBLIOTECA LOCAL</small><h1>Manga Desktop</h1></div><button id="add">+ Añadir cómics</button></header><main><p id="error" role="alert"></p><section class="manager-note"><p>Organiza tus libros en listas y elige qué estante mostrar en cada pantalla.</p><div class="controls"><label>Lista <select id="collection"></select></label><label>Nueva lista <input id="collection-name" maxlength="80" placeholder="Nombre de la lista"></label><button id="collection-create">Crear lista</button></div><div class="controls"><label>Pantalla <select id="display"></select></label><button id="wallpaper">Mostrar esta lista</button><button id="wallpaper-remove">Quitar de esta pantalla</button><span id="display-status" aria-live="polite"></span></div><p id="membership-help"></p></section><div id="shelf" hidden></div><aside id="peek" hidden><button id="peek-close" aria-label="Devolver al estante">×</button><h2 id="peek-title"></h2><p>Selecciona el tomo para continuar leyendo.</p><button id="peek-read">Leer</button></aside><section id="library"></section><section id="viewer" hidden><div id="book3d" hidden></div><nav><button id="back">← Estante</button><strong id="title"></strong><span id="counter"></span><button id="previous">Anterior</button><button id="next">Siguiente</button></nav><img id="page" alt="Página del cómic"><canvas id="pdf-page" hidden aria-label="Página del PDF"></canvas></section></main><div id="desktop-menu" hidden><div id="menu-lists" class="menu-lists" hidden></div><nav aria-label="Controles del escritorio"><button id="menu-collections" aria-expanded="false" aria-controls="menu-lists">Listas</button><button id="menu-refresh" title="Actualizar estante">Actualizar</button><button id="menu-left" aria-label="Mover a la izquierda">←</button><button id="menu-right" aria-label="Mover a la derecha">→</button><button id="menu-back" hidden>Volver al estante</button><button id="menu-zoom-out" aria-label="Reducir zoom">−</button><span id="menu-zoom-level" aria-live="polite">100 %</span><button id="menu-zoom-in" aria-label="Aumentar zoom">+</button></nav><div id="menu-current" aria-live="polite"></div></div><script src="turn-sound.js"></script><script src="renderer.js"></script></body></html>
